name: readysafe
description: ReadySafe is an emergency preparedness companion with online maps and offline-ready emergency guidance.
publish_to: none
version: 3.1.1+9

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.1
  maplibre_gl: 0.26.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/illustrations/
