name: readysafe
description: ReadySafe V4 is an offline-first survival field guide, waypoint navigator and regional atlas in development.
publish_to: none
version: 4.0.0-dev.3+21

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.1
  maplibre_gl: 0.27.1
  crypto: ^3.0.6
  path_provider: ^2.1.5
  file_picker: 12.1.3
  xml: ^7.0.1
  pdf: ^3.13.1
  printing: ^5.14.3
  image: ^4.12.0
  flutter_tts: ^4.2.5
  geolocator: ^14.0.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/illustrations/
    - assets/first_aid_sheets/
