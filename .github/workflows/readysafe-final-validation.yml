name: ReadySafe Final Validation

on:
  push:
    branches:
      - work/readysafe-v3-batch2
    paths:
      - .github/readysafe-final-validation.trigger

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build split test APKs
        run: flutter build apk --debug --split-per-abi
      - name: Upload split test APKs
        uses: actions/upload-artifact@v4
        with:
          name: ReadySafe_3.4.6_test_APKs_split
          path: build/app/outputs/flutter-apk/app-*-debug.apk
          if-no-files-found: error
          retention-days: 7
