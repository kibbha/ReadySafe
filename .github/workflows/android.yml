name: Android CI

on:
  push:
    branches:
      - main
      - work
      - feature/storyboard-production
      - refactor/readysafe-v3
      - work/readysafe-v3-batch2
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: What should this run produce?
        required: true
        default: verify
        type: choice
        options:
          - verify
          - test-apk
          - release

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build split test APKs
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'test-apk') || (github.event_name == 'push' && github.ref == 'refs/heads/work/readysafe-v3-batch2')
        run: flutter build apk --debug --split-per-abi

      - name: Upload split test APKs
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'test-apk') || (github.event_name == 'push' && github.ref == 'refs/heads/work/readysafe-v3-batch2')
        uses: actions/upload-artifact@v4
        with:
          name: ReadySafe_test_APKs_split
          path: build/app/outputs/flutter-apk/app-*-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Validate release signing secrets
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Prepare release signing
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/app/upload-keystore.jks
          EOF

      - name: Build release split APKs
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
        run: flutter build apk --release --split-per-abi

      - name: Build release App Bundle
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
        run: flutter build appbundle --release

      - name: Upload release artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ReadySafe_release
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
