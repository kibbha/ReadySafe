name: ReadySafe V4 Android test APK

on:
  push:
    branches:
      - feature/survival-atlas-offline-v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readysafe-v4-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-apk:
    name: Verify and build Android debug APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'ci(v4): build')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout selected V4 branch
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      - name: Resolve Dart and Flutter dependencies
        run: flutter pub get

      - name: Flutter static analysis
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build Android debug APKs
        run: flutter build apk --debug --split-per-abi

      - name: Inspect APK files
        run: |
          set -euo pipefail
          ls -lh build/app/outputs/flutter-apk/*debug.apk
          sha256sum build/app/outputs/flutter-apk/*debug.apk

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: ReadySafe_V4_test_APKs
          path: build/app/outputs/flutter-apk/app-*-debug.apk
          if-no-files-found: error
          retention-days: 14
